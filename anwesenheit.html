<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Anwesenheit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css" />
      <meta name="theme-color" content="#171F36" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
  </head>
  <body class="text-slate-800 min-h-screen">
    <main class="max-w-md mx-auto px-4 py-8 space-y-5">
      <header class="text-center">
        <svg class="mx-auto mb-3" width="36" height="36" viewBox="0 0 40 40" fill="none" stroke="rgb(var(--a600))" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 36V17a12 12 0 0 1 24 0v19z"/><path d="M20 15v14M14 21h12"/></svg>
        <h1 class="serif text-3xl font-semibold text-slate-900">Ich bin da</h1>
        <p class="text-sm text-slate-500 mt-1">Melde dich in der Sakristei zum Dienst an.</p>
      </header>

      <div id="message" role="alert" class="hidden text-sm rounded-lg p-3 border"></div>

      <form id="login-form" class="panel panel-pad space-y-4 hidden">
        <div>
          <label for="name-select" class="label">Wer bist du?</label>
          <select id="name-select" required class="field"><option value="">Wird geladen …</option></select>
        </div>
        <div>
          <label for="pin-input" class="label">Deine PIN</label>
          <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required placeholder="4 Ziffern" class="field tracking-widest" />
          <p class="hint mt-1">Die PIN hast du von den Leitern bekommen.</p>
        </div>
        <label class="flex items-start gap-2 text-sm text-slate-600">
          <input id="remember" type="checkbox" checked class="mt-0.5 rounded accent-[rgb(var(--a600))]" />
          <span>Auf diesem Gerät merken <span class="block text-xs text-slate-400">Nicht ankreuzen bei fremden oder gemeinsam genutzten Geräten.</span></span>
        </label>
        <button id="login-btn" type="submit" class="btn btn-primary btn-block">Weiter</button>
      </form>

      <section id="app" class="hidden space-y-4">
        <p class="text-sm text-slate-600">Angemeldet als <strong id="who" class="text-slate-900"></strong>
          <button id="logout-btn" type="button" class="text-slate-500 underline ml-2">Abmelden</button></p>
        <div id="dienste" class="space-y-3"></div>
        <p id="leer" class="panel panel-pad text-sm text-slate-600 hidden">Gerade ist kein Gottesdienst zum Einchecken offen. Das geht ab 90 Minuten vor Beginn.</p>
      </section>
    </main>

    <script>
      const SUPABASE_URL = "https://wkeccnqquqwszbjhdfqo.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZWNjbnFxdXF3c3piamhkZnFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjYwNzcsImV4cCI6MjEwODM0MjA3N30.FhbXCHfHV0H0vBp5GVF9J-vADXJ65eJ61-OMjQ2-PpY";
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });

      const $ = (id) => document.getElementById(id);
      const key = new URLSearchParams(location.search).get("k") || "";
      let session = null; // { id, pin, name } nur im Arbeitsspeicher

      function showMessage(text, kind) {
        const box = $("message");
        if (!text) { box.classList.add("hidden"); return; }
        box.textContent = text;
        box.className = "text-sm rounded-lg p-3 border " + (kind === "ok" ? "bg-brand-50 border-brand-100 text-brand-700" : "bg-[#fbe7e5] border-[#f1c9c5] text-[#a02d25]");
      }
      function errorText(code) {
        return ({
          wrong: "Die PIN stimmt nicht.",
          locked: "Zu viele Fehlversuche. Bitte versuche es in 15 Minuten noch einmal.",
          nopin: "Für dich ist noch keine PIN hinterlegt. Frag bitte einen Leiter.",
          closed: "Dieser Gottesdienst ist gerade nicht zum Einchecken offen.",
          badkey: "Dieser QR-Code ist nicht (mehr) gültig. Bitte scanne den aktuellen Code in der Sakristei.",
        })[code] || "Das hat leider nicht geklappt. Bitte versuche es später noch einmal.";
      }
      function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      function recall(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function forget(k) { try { localStorage.removeItem(k); } catch (e) {} }

      function renderDienste(list) {
        const box = $("dienste");
        box.innerHTML = "";
        $("leer").classList.toggle("hidden", list.length > 0);
        list.forEach((g) => {
          const card = document.createElement("div");
          card.className = "panel panel-pad space-y-3";
          const h = document.createElement("div");
          const t = document.createElement("p");
          t.className = "serif text-xl font-semibold text-slate-900";
          t.textContent = g.titel || "Gottesdienst";
          const sub = document.createElement("p");
          sub.className = "hint";
          sub.textContent = (g.zeit ? g.zeit.slice(0, 5) + " Uhr" : "") + (g.eingeteilt ? "" : (g.zeit ? " · " : "") + "Du bist nicht eingeteilt, kannst aber trotzdem einchecken");
          h.append(t, sub);
          card.append(h);
          if (g.eingetragen) {
            const ok = document.createElement("p");
            ok.className = "badge badge-ok inline-flex";
            ok.textContent = "Eingecheckt um " + g.eingetragen + " Uhr";
            card.append(ok);
          } else {
            const b = document.createElement("button");
            b.type = "button"; b.className = "btn btn-primary btn-block"; b.textContent = "Ich bin da";
            b.addEventListener("click", () => checkin(g.id, b));
            card.append(b);
          }
          box.append(card);
        });
      }

      function enterApp(list) {
        $("login-form").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("who").textContent = session.name;
        renderDienste(list);
      }
      function leaveApp() {
        session = null; forget("abwesenheit-pin"); $("pin-input").value = "";
        $("app").classList.add("hidden"); $("login-form").classList.remove("hidden"); showMessage("");
      }

      async function loadNames() {
        const select = $("name-select");
        const { data, error } = await sb.rpc("absence_names");
        if (error || !Array.isArray(data) || data.length === 0) { select.innerHTML = '<option value="">Nicht verfügbar</option>'; return; }
        select.innerHTML = '<option value="">Bitte wählen …</option>';
        data.forEach((p) => { const o = document.createElement("option"); o.value = p.id; o.textContent = p.name; select.appendChild(o); });
        const saved = recall("abwesenheit-mini-id");
        if (saved && data.some((p) => String(p.id) === saved)) select.value = saved;
      }

      // Anmeldedaten teilt sich diese Seite mit der Abwesenheits-Seite
      async function login(id, pin, remember, auto) {
        const btn = $("login-btn"); btn.disabled = true;
        const { data, error } = await sb.rpc("checkin_list", { p_key: key, p_id: id, p_pin: pin });
        btn.disabled = false;
        if (error || !data) { showMessage(errorText(), "error"); return false; }
        if (!data.ok) {
          if (["wrong", "locked", "nopin"].includes(data.error)) { forget("abwesenheit-pin"); $("pin-input").value = ""; }
          showMessage(auto && data.error === "wrong" ? "Deine gespeicherte PIN stimmt nicht mehr. Bitte gib sie neu ein." : errorText(data.error), "error");
          return false;
        }
        remember ? (store("abwesenheit-mini-id", id), store("abwesenheit-pin", pin)) : (store("abwesenheit-mini-id", id), forget("abwesenheit-pin"));
        const opt = Array.from($("name-select").options).find((o) => o.value === id);
        session = { id, pin, name: opt ? opt.textContent : "" };
        enterApp(data.dienste || []);
        return true;
      }

      async function checkin(gid, btn) {
        if (!session) return;
        showMessage(""); btn.disabled = true;
        const { data, error } = await sb.rpc("checkin_set", { p_key: key, p_id: session.id, p_pin: session.pin, p_gid: gid });
        if (error || !data || !data.ok) { btn.disabled = false; return showMessage(errorText(data && data.error), "error"); }
        renderDienste(data.dienste || []);
        showMessage("Danke, du bist eingecheckt!", "ok");
      }

      $("login-form").addEventListener("submit", async (e) => {
        e.preventDefault(); showMessage("");
        const id = $("name-select").value, pin = $("pin-input").value.trim();
        if (!id) return showMessage("Bitte wähle deinen Namen aus.", "error");
        if (!/^\d{4}$/.test(pin)) return showMessage("Die PIN besteht aus 4 Ziffern.", "error");
        await login(id, pin, $("remember").checked, false);
      });
      $("logout-btn").addEventListener("click", leaveApp);

      (async () => {
        if (!/^[a-f0-9]{64}$/.test(key)) { showMessage(errorText("badkey"), "error"); return; }
        $("login-form").classList.remove("hidden");
        await loadNames();
        const id = recall("abwesenheit-mini-id"), pin = recall("abwesenheit-pin");
        if (id && pin && /^\d{4}$/.test(pin) && $("name-select").value === id) await login(id, pin, true, true);
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
