<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Abwesenheit eintragen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { brand: { 50: "#f0fdf4", 100: "#dcfce7", 500: "#22c55e", 600: "#16a34a", 700: "#15803d" } } } } };
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen">
    <main class="max-w-md mx-auto px-4 py-8 space-y-5">
      <header class="text-center">
        <div class="text-4xl mb-2">⛪</div>
        <h1 class="text-2xl font-bold text-slate-900">Abwesenheit eintragen</h1>
        <p class="text-sm text-slate-500 mt-1">Sag uns, wann du nicht zum Dienst kommen kannst.</p>
      </header>

      <div id="message" role="alert" class="hidden text-sm rounded-lg p-3 border"></div>

      <!-- Anmeldung -->
      <form id="login-form" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
        <div>
          <label for="name-select" class="block text-sm font-medium text-slate-700 mb-1">Wer bist du?</label>
          <select id="name-select" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base bg-white focus:ring-2 focus:ring-brand-500 focus:outline-none">
            <option value="">Wird geladen …</option>
          </select>
        </div>
        <div>
          <label for="pin-input" class="block text-sm font-medium text-slate-700 mb-1">Deine PIN</label>
          <input id="pin-input" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required
            placeholder="4 Ziffern" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base tracking-widest focus:ring-2 focus:ring-brand-500 focus:outline-none" />
          <p class="text-xs text-slate-500 mt-1">Die PIN hast du von den Leitern bekommen. PIN vergessen? Frag einfach nach.</p>
        </div>
        <label class="flex items-start gap-2 text-sm text-slate-600">
          <input id="remember" type="checkbox" checked class="mt-0.5 rounded text-brand-600" />
          <span>Auf diesem Gerät merken <span class="block text-xs text-slate-400">Dann musst du dich nächstes Mal nicht neu anmelden. Nicht ankreuzen bei fremden oder gemeinsam genutzten Geräten.</span></span>
        </label>
        <button id="login-btn" type="submit" class="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white py-2.5 rounded-lg font-medium transition">Weiter</button>
      </form>

      <!-- Eingeloggt -->
      <section id="app" class="hidden space-y-5">
        <div class="flex items-center justify-between">
          <p class="text-sm text-slate-600">Angemeldet als <strong id="who" class="text-slate-900"></strong></p>
          <button id="logout-btn" type="button" class="text-sm text-slate-500 hover:text-slate-800 underline">Abmelden</button>
        </div>

        <form id="add-form" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
          <h2 class="font-semibold text-slate-900">Neue Abwesenheit</h2>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="von" class="block text-sm font-medium text-slate-700 mb-1">Von</label>
              <input id="von" type="date" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base focus:ring-2 focus:ring-brand-500 focus:outline-none" />
            </div>
            <div>
              <label for="bis" class="block text-sm font-medium text-slate-700 mb-1">Bis (einschließlich)</label>
              <input id="bis" type="date" required class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-base focus:ring-2 focus:ring-brand-500 focus:outline-none" />
            </div>
          </div>
          <p class="text-xs text-slate-500">Nur ein Tag? Dann wähle zweimal dasselbe Datum.</p>
          <button id="add-btn" type="submit" class="w-full bg-brand-600 hover:bg-brand-700 disabled:opacity-60 text-white py-2.5 rounded-lg font-medium transition">Eintragen</button>
        </form>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
          <h2 class="font-semibold text-slate-900 mb-2">Meine Abwesenheiten</h2>
          <ul id="list" class="divide-y divide-slate-100"></ul>
        </div>
      </section>
    </main>

    <script>
      const SUPABASE_URL = "https://wkeccnqquqwszbjhdfqo.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndrZWNjbnFxdXF3c3piamhkZnFvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjYwNzcsImV4cCI6MjEwODM0MjA3N30.FhbXCHfHV0H0vBp5GVF9J-vADXJ65eJ61-OMjQ2-PpY";
      // Keine Sitzung speichern, damit die Leiter-Anmeldung im selben Browser nicht gestört wird
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });

      const $ = (id) => document.getElementById(id);
      const weekdays = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
      let session = null; // { id, pin, name } nur im Arbeitsspeicher

      function showMessage(text, kind) {
        const box = $("message");
        if (!text) { box.classList.add("hidden"); return; }
        box.textContent = text;
        box.className = "text-sm rounded-lg p-3 border " + (kind === "ok"
          ? "bg-emerald-50 border-emerald-200 text-emerald-800"
          : "bg-rose-50 border-rose-200 text-rose-800");
      }

      function errorText(code) {
        return ({
          wrong: "Die PIN stimmt nicht.",
          locked: "Zu viele Fehlversuche. Bitte versuche es in 15 Minuten noch einmal.",
          nopin: "Für dich ist noch keine PIN hinterlegt. Frag bitte einen Leiter.",
          dates: "Bitte prüfe die Daten: „Bis“ darf nicht vor „Von“ liegen und muss in der Zukunft enden.",
          limit: "Du hast schon sehr viele Einträge. Lösche alte oder melde dich bei den Leitern.",
        })[code] || "Das hat leider nicht geklappt. Bitte versuche es später noch einmal.";
      }

      function formatDate(iso) {
        const [y, m, d] = iso.split("-").map(Number);
        const wd = weekdays[new Date(y, m - 1, d).getDay()];
        return `${wd}, ${String(d).padStart(2, "0")}.${String(m).padStart(2, "0")}.${y}`;
      }

      function todayIso() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      }

      function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
      function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
      function forget(key) { try { localStorage.removeItem(key); } catch (e) {} }

      async function loadNames() {
        const select = $("name-select");
        const { data, error } = await sb.rpc("absence_names");
        if (error || !Array.isArray(data)) {
          select.innerHTML = '<option value="">Nicht verfügbar</option>';
          showMessage("Die Seite ist noch nicht eingerichtet. Bitte sag einem Leiter Bescheid.", "error");
          return;
        }
        if (data.length === 0) {
          select.innerHTML = '<option value="">Noch niemand freigeschaltet</option>';
          return;
        }
        select.innerHTML = '<option value="">Bitte wählen …</option>';
        data.forEach((p) => {
          const opt = document.createElement("option");
          opt.value = p.id;
          opt.textContent = p.name;
          select.appendChild(opt);
        });
        const saved = recall("abwesenheit-mini-id");
        if (saved && data.some((p) => String(p.id) === saved)) select.value = saved;
      }

      function renderList(items) {
        const list = $("list");
        list.innerHTML = "";
        if (!items.length) {
          const li = document.createElement("li");
          li.className = "py-3 text-sm text-slate-500";
          li.textContent = "Keine Abwesenheiten eingetragen.";
          list.appendChild(li);
          return;
        }
        items.forEach((a) => {
          const li = document.createElement("li");
          li.className = "py-3 flex items-center justify-between gap-3";
          const text = document.createElement("span");
          text.className = "text-sm text-slate-800";
          text.textContent = a.von === a.bis ? formatDate(a.von) : `${formatDate(a.von)} – ${formatDate(a.bis)}`;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "text-sm text-rose-600 hover:text-rose-800 shrink-0";
          btn.textContent = "Löschen";
          btn.addEventListener("click", () => removeAbsence(a.id, btn));
          li.append(text, btn);
          list.appendChild(li);
        });
      }

      function enterApp(result) {
        $("login-form").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("who").textContent = session.name;
        const t = todayIso();
        $("von").min = t; $("bis").min = t;
        $("von").value = ""; $("bis").value = "";
        renderList(result.abwesenheiten || []);
      }

      function leaveApp() {
        session = null;
        forget("abwesenheit-pin");
        $("pin-input").value = "";
        $("app").classList.add("hidden");
        $("login-form").classList.remove("hidden");
        showMessage("");
      }

      // auto = gespeicherte Zugangsdaten beim Öffnen der Seite
      async function login(id, pin, remember, auto) {
        const btn = $("login-btn");
        btn.disabled = true;
        const { data, error } = await sb.rpc("absence_get", { p_id: id, p_pin: pin });
        btn.disabled = false;
        if (error || !data) { showMessage(errorText(), "error"); return false; }
        if (!data.ok) {
          forget("abwesenheit-pin");
          $("pin-input").value = "";
          showMessage(auto && data.error === "wrong" ? "Deine gespeicherte PIN stimmt nicht mehr. Bitte gib sie neu ein." : errorText(data.error), "error");
          return false;
        }
        remember ? (store("abwesenheit-mini-id", id), store("abwesenheit-pin", pin)) : (store("abwesenheit-mini-id", id), forget("abwesenheit-pin"));
        const opt = Array.from($("name-select").options).find((o) => o.value === id);
        session = { id, pin, name: opt ? opt.textContent : "" };
        enterApp(data);
        return true;
      }

      $("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        showMessage("");
        const id = $("name-select").value;
        const pin = $("pin-input").value.trim();
        if (!id) return showMessage("Bitte wähle deinen Namen aus.", "error");
        if (!/^\d{4}$/.test(pin)) return showMessage("Die PIN besteht aus 4 Ziffern.", "error");
        await login(id, pin, $("remember").checked, false);
      });

      $("add-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!session) return;
        showMessage("");
        const von = $("von").value, bis = $("bis").value;
        if (!von || !bis || bis < von) return showMessage(errorText("dates"), "error");
        const btn = $("add-btn");
        btn.disabled = true;
        const { data, error } = await sb.rpc("absence_add", { p_id: session.id, p_pin: session.pin, p_von: von, p_bis: bis });
        btn.disabled = false;
        if (error || !data) return showMessage(errorText(), "error");
        if (!data.ok) return showMessage(errorText(data.error), "error");
        $("von").value = ""; $("bis").value = "";
        renderList(data.abwesenheiten);
        showMessage("Gespeichert. Danke für die Info!", "ok");
      });

      async function removeAbsence(absId, btn) {
        if (!session) return;
        showMessage("");
        btn.disabled = true;
        const { data, error } = await sb.rpc("absence_delete", { p_id: session.id, p_pin: session.pin, p_abs_id: absId });
        if (error || !data || !data.ok) { btn.disabled = false; return showMessage(errorText(data && data.error), "error"); }
        renderList(data.abwesenheiten);
      }

      // „Bis“ folgt automatisch dem Startdatum, solange es nicht schon früher liegt
      $("von").addEventListener("change", () => {
        const von = $("von").value;
        if (von && (!$("bis").value || $("bis").value < von)) $("bis").value = von;
        $("bis").min = von || todayIso();
      });

      $("logout-btn").addEventListener("click", leaveApp);
      (async () => {
        await loadNames();
        const id = recall("abwesenheit-mini-id"), pin = recall("abwesenheit-pin");
        if (id && pin && /^\d{4}$/.test(pin) && $("name-select").value === id) await login(id, pin, true, true);
      })();
    </script>
  </body>
</html>
